# The annotation checkable.ai/register-id names the entry in ai-vendor-register.yaml that covers this service.
# The model endpoint, vendor and plan come from the ConfigMap in 10-configmap.yaml through envFrom.
#
# The image is a small public placeholder web server (port 8080). It stands in for the summariser so the
# rollout has something to wait for. Pin a version tag or a digest: the check warns on "latest".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: summariser
  namespace: summariser
  labels:
    app.kubernetes.io/name: summariser
  annotations:
    checkable.ai/register-id: gemini-api-paid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: summariser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: summariser
    spec:
      automountServiceAccountToken: false
      containers:
        - name: summariser
          image: registry.k8s.io/e2e-test-images/agnhost:2.66.1
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: summariser-model
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
